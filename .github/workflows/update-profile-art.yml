name: Update profile art

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_profile_art.py
      - scripts/update_github_stats.py
      - scripts/i18n.py
      - .github/workflows/update-profile-art.yml

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Refresh contribution stats from the public calendar
        run: python scripts/update_profile_art.py
      - name: Refresh GitHub stats and languages from the REST API
        # The API can rate-limit; keep the previous card and still commit the calendar stats.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_github_stats.py
      - name: Commit updated artwork
        run: |
          git add data/contributions.json data/github-stats.json assets/contrib-stats*.svg assets/github-stats*.svg \
            assets/pt/contrib-stats*.svg assets/pt/github-stats*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile stats [skip ci]'
          git push
