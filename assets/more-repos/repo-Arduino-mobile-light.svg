<svg xmlns="http://www.w3.org/2000/svg" width="420" height="30" viewBox="0 0 420 30" role="img" aria-labelledby="title desc">
<title id="title">Arduino</title>
<desc id="desc">Arduino and ESP32 experiments, sensors to servers (C++)</desc>
<style>
text { font-family: 'DejaVu Sans Mono', 'Liberation Mono', Consolas, monospace; }
.line { animation: print-line .4s both; }
.grow { animation: grow .7s cubic-bezier(.2, .7, .3, 1) both; transform-box: fill-box; transform-origin: left center; }
@keyframes print-line { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
