<svg xmlns="http://www.w3.org/2000/svg" width="420" height="172" viewBox="0 0 420 172" role="img" aria-labelledby="title desc">
<title id="title">Artemis Bot (temporario-ath)</title>
<desc id="desc">WhatsApp sales assistant: qualifies leads, handles objections, bills through Asaas and books meetings on Google Calendar.</desc>
<style>
text { font-family: 'DejaVu Sans Mono', 'Liberation Mono', Consolas, monospace; }
.line { animation: print-line .4s both; }
.grow { animation: grow .7s cubic-bezier(.2, .7, .3, 1) both; transform-box: fill-box; transform-origin: left center; }
@keyframes print-line { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { .line, .grow { animation: none; } }
</style>
<rect x=".5" y=".5" width="419" height="171" rx="12" fill="#0D1117" stroke="#30363D" />
<path d="M1 36H419" stroke="#30363D" />
<circle cx="18" cy="18" r="3.5" fill="#6C63FF" /><circle cx="30" cy="18" r="3.5" fill="#434B5A" /><circle cx="42" cy="18" r="3.5" fill="#434B5A" />
<text x="56" y="22" fill="#9BA6B8" font-size="11">~/temporario-ath</text>
<g class="line" style="animation-delay:.1s"><text x="20" y="64" fill="#F0F3F8" font-size="16" font-weight="bold">Artemis Bot</text></g>
<g class="line" style="animation-delay:0.18s"><text x="20" y="90" fill="#D2D8E3" font-size="12">WhatsApp sales assistant: qualifies leads, handles</text></g>
<g class="line" style="animation-delay:0.24s"><text x="20" y="108" fill="#D2D8E3" font-size="12">objections, bills through Asaas and books meetings</text></g>
<g class="line" style="animation-delay:0.30s"><text x="20" y="126" fill="#D2D8E3" font-size="12">on Google Calendar.</text></g>
<g class="line" style="animation-delay:.4s"><circle cx="25" cy="151" r="5" fill="#3178C6" /><text x="36" y="155" fill="#D2D8E3" font-size="12">TypeScript</text><text x="400" y="155" text-anchor="end" fill="#9BA6B8" font-size="11">Gemini · Express · Prisma</text></g>
</svg>
