<svg xmlns="http://www.w3.org/2000/svg" width="420" height="172" viewBox="0 0 420 172" role="img" aria-labelledby="title desc">
<title id="title">PIXEL (Pixel)</title>
<desc id="desc">Plataforma de tela única sem nenhum asset importado. Cada sprite, som e letra da fonte é gerado em código.</desc>
<style>
text { font-family: 'DejaVu Sans Mono', 'Liberation Mono', Consolas, monospace; }
.line { animation: print-line .4s both; }
.grow { animation: grow .7s cubic-bezier(.2, .7, .3, 1) both; transform-box: fill-box; transform-origin: left center; }
@keyframes print-line { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { .line, .grow { animation: none; } }
</style>
<rect x=".5" y=".5" width="419" height="171" rx="12" fill="#FFFFFF" stroke="#D0D7DE" />
<path d="M1 36H419" stroke="#D0D7DE" />
<circle cx="18" cy="18" r="3.5" fill="#6C63FF" /><circle cx="30" cy="18" r="3.5" fill="#D0D7DE" /><circle cx="42" cy="18" r="3.5" fill="#D0D7DE" />
<text x="56" y="22" fill="#57606A" font-size="11">~/Pixel</text>
<g class="line" style="animation-delay:.1s"><text x="20" y="64" fill="#1F2328" font-size="16" font-weight="bold">PIXEL</text></g>
<g class="line" style="animation-delay:0.18s"><text x="20" y="90" fill="#24292F" font-size="12">Plataforma de tela única sem nenhum asset importado.</text></g>
<g class="line" style="animation-delay:0.24s"><text x="20" y="108" fill="#24292F" font-size="12">Cada sprite, som e letra da fonte é gerado em</text></g>
<g class="line" style="animation-delay:0.30s"><text x="20" y="126" fill="#24292F" font-size="12">código.</text></g>
<g class="line" style="animation-delay:.4s"><circle cx="25" cy="151" r="5" fill="#355570" /><text x="36" y="155" fill="#24292F" font-size="12">GDScript</text><text x="400" y="155" text-anchor="end" fill="#57606A" font-size="11">Godot 4.6</text></g>
</svg>
