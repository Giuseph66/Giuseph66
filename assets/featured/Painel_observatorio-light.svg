<svg xmlns="http://www.w3.org/2000/svg" width="420" height="172" viewBox="0 0 420 172" role="img" aria-labelledby="title desc">
<title id="title">E-participação MT (Painel_observatorio)</title>
<desc id="desc">No-dependency dashboard of e-participation in the municipalities of Mato Grosso, with a heat map and a bar chart that move together.</desc>
<style>
text { font-family: 'DejaVu Sans Mono', 'Liberation Mono', Consolas, monospace; }
.line { animation: print-line .4s both; }
.grow { animation: grow .7s cubic-bezier(.2, .7, .3, 1) both; transform-box: fill-box; transform-origin: left center; }
@keyframes print-line { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { .line, .grow { animation: none; } }
</style>
